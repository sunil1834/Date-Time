name: Run Jupyter Notebook

on:
  workflow_dispatch:
  schedule:
  - cron: '*/5 * * * *'
permissions:
  contents: write

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install notebook nbconvert ipykernel

      - name: Execute Notebook
        run: |
          jupyter nbconvert --to notebook --execute Date_Time.ipynb --output Date_Time.ipynb --ExecutePreprocessor.timeout=1200

      - name: Commit & Push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "chore: auto-run notebook"
          git push
